name: Deploy to Cloudflare Workers (DISABLED - Vercel only)

# DISABLED: production deploys are Vercel-only (deploy-vercel.yml).
# No push/PR/schedule triggers. Kept as manual workflow_dispatch only, and the
# job is skipped unless the operator types the exact confirmation string, so
# an accidental "Run workflow" click does nothing.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Cloudflare deploy is disabled (Vercel only). Type I-KNOW-CLOUDFLARE-IS-DISABLED to run anyway.'
        required: true
        default: 'no'

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'I-KNOW-CLOUDFLARE-IS-DISABLED' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check Cloudflare secrets exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deploy is frozen. Use Vercel (see Transfers/cto_alt_deploy.md)."
            exit 1
          fi
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
